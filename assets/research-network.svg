<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 490">
  <defs><radialGradient id="glow"><stop stop-color="#c4ddd2"/><stop offset="1" stop-color="#eaf0ec"/></radialGradient></defs>
  <style>
    .signals { stroke-dasharray: 6 24; animation: signal-flow 8s linear infinite; }
    .nodes circle { transform-box: fill-box; transform-origin: center; animation: node-pulse 5s ease-in-out infinite; }
    .nodes circle:nth-child(3n + 1) { animation-delay: -1.5s; }
    .nodes circle:nth-child(3n + 2) { animation-delay: -3s; }
    .satellites { transform-origin: 220px 228px; animation: orbit 60s linear infinite; }
    @keyframes signal-flow { to { stroke-dashoffset: -120; } }
    @keyframes node-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .signals, .nodes circle, .satellites { animation: none; }
    }
  </style>
  <rect width="440" height="490" fill="url(#glow)"/>
  <g fill="none" stroke="#b5cbc1" stroke-width="1">
