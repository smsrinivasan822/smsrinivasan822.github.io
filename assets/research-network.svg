    <path d="M108 152L175 208 220 94 263 222 333 166M175 208L76 237 218 280 133 316M263 222L357 282 218 280 267 344M175 208L263 222 218 280Z"/>
    <path d="M108 152L263 222M333 166L218 280M133 316L175 208" opacity=".5"/>
  </g>
  <g class="signals" fill="none" stroke="#1a6865" stroke-width="2" opacity=".65">
    <path d="M108 152L175 208 263 222 333 166M175 208L218 280 267 344M76 237L218 280 357 282"/>
  </g>
  <g class="nodes" fill="#1a6865" stroke="#eaf0ec" stroke-width="5">
