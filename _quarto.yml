project:
  type: default
  post-render:
    - python scripts/build-search-index.py
  render:
    - index.qmd
    - teaching/**/*.qmd
    - course-development/index.qmd
    - service/index.qmd
    - research/index.qmd
    - publications/index.qmd

format:
  html:
    theme: none
    minimal: true
    embed-resources: true
    page-layout: full
    title-block-style: none
    toc: false
    lang: en
    css: styles.css
